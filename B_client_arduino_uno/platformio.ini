; GAIMSAT-1 Refuel CLIENT docking-port controller — Arduino Uno R3
; Build: pio run -e uno   (produces .pio/build/uno/firmware.hex)
; Flash: hex -> jetson1 -> avrdude -c arduino -p atmega328p -P /dev/ttyACM1 -b 115200
[platformio]
src_dir = .

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
