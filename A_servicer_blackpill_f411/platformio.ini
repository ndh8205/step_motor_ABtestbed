; Refuel Servicer 2 (BULLDOZER) — WeAct Black Pill V3.x (STM32F411CEU6)
; 제어: 릴레이 8(밸브) + 불도저 스텝모터(NK266/SBD-20, 볼스크류 이송)
;   2026-06-26: 그리퍼 → 불도저로 교체. 결선 PNP/active-high (COM=GND).
;   후배 Servicer_Bulldozer.ino / BulldozerMotor.cpp 로직 이식 (블로킹→논블로킹).
;
; Upload : ST ROM DFU bootloader (system memory @ 0x1FFF0000)
;          첫 플래시는 물리 BOOT0+RESET, 이후 USB serial "BOOT\n" → 펌웨어가
;          ROM DFU로 자체 점프 → dfu-util 재플래시. (IREC gimbal_fw와 동일)
; 빌드/플래시: 이 PC 로컬 — C:\Users\USER\pio-venv\Scripts\pio.exe

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino

; --- Upload via ROM DFU (PID 0483:DF11) ---
upload_protocol = dfu

; --- USB CDC for host comm (COMx / /dev/ttyACMx) ---
build_flags =
    -D USBCON
    -D USBD_USE_CDC
    -D USB_MANUFACTURER="\"GAIMSat\""
    -D USB_PRODUCT="\"Refuel Servicer 2\""

monitor_speed = 115200
